[project]
name = "iris-plugin-gaia"
version = "0.1.0"
description = "Plugin opcional do IRIS que conecta o popup radial à GAIA (Project G.A.I.A) - só instala quem também tem a GAIA."
requires-python = ">=3.11"
dependencies = []

# O IRIS descobre plugins por este grupo de entry points (iris/main.py).
[project.entry-points."iris.plugins"]
gaia = "iris_plugin_gaia:registrar"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iris_plugin_gaia*"]
