name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # windows: o core usa winreg, pywin32 e RegisterHotKey
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
